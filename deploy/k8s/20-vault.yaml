# The vault: the only process in the system that ever holds a raw card number.
#
# Everything unusual in this file is unusual on purpose.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: payflow-cde
  annotations:
    # IRSA. This service account, and only this one, can assume a role whose
    # policy permits kms:Decrypt on the card-encryption key.
    #
    # This is the control that survives a namespace being compromised: even
    # with a shell in another pod, an attacker cannot unwrap a data key, because
    # the permission is bound to a Kubernetes service account identity rather
    # than to the node. It is also why the egress policy blocks 169.254.169.254
    # — reaching the instance metadata service is the standard way to bypass
    # exactly this and pick up the node role instead.
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/payflow-vault
automountServiceAccountToken: true
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: payflow-cde
spec:
  selector:
    app: vault
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: payflow-cde
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      # Dedicated nodes. The taint on the node group means nothing schedules
      # here unless it carries the matching toleration, so a card-handling
      # process never shares a kernel with the dashboard API.
      #
      # Shared kernel means shared attack surface: a container escape is a
      # kernel bug away, and this is what decides whether the blast radius
      # includes cardholder data.
      nodeSelector:
        payflow.io/workload: cde
      tolerations:
        - key: payflow.io/cde
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Spread across availability zones. Two replicas on one node is one
      # eviction away from no card tokenization at all, which means no payments.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: ${ECR_REGISTRY}/payflow-vault:${IMAGE_TAG}
          ports:
            - containerPort: 8081
          env:
            - name: PAYFLOW_ENV
              # Not cosmetic: the service refuses to start in production without
              # a real VAULT_MASTER_KEY and VAULT_INTERNAL_SECRET rather than
              # generating a development key. A vault running on a known key is
              # worse than no vault, because it looks protected.
              value: production
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: payflow-db, key: url }
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: payflow-redis, key: url }
            - name: VAULT_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: payflow-vault, key: master-key }
            - name: VAULT_INTERNAL_SECRET
              valueFrom:
                secretKeyRef: { name: payflow-vault, key: internal-secret }
            - name: CARD_HASH_SALT
              valueFrom:
                secretKeyRef: { name: payflow-vault, key: card-hash-salt }
            - name: VAULT_TOKEN_TTL
              value: "15m"
            # Origins allowed to FRAME the card input, enforced by
            # Content-Security-Policy: frame-ancestors. Anything not listed
            # here cannot embed the iframe, which is the clickjacking control.
            # Both PayFlow origins are here because the hosted payment page
            # (served by payments-api) frames the vault too.
            - name: CHECKOUT_ALLOWED_ORIGINS
              value: "https://api.${DOMAIN} https://dashboard.${DOMAIN}"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Without this, a node drain during a cluster upgrade can take both replicas at
# once. No vault means no tokenization means no payments, for everyone.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vault
  namespace: payflow-cde
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vault
