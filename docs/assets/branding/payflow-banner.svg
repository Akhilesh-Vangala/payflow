<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
<title id="title">PayFlow payment gateway</title>
<desc id="desc">Exactly-once charges with a double-entry ledger.</desc>
<rect width="1280" height="280" rx="12" fill="#0B1220"/>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#1A2740" stroke-width="0.5"/>
  </pattern>
</defs>
<rect x="736" width="544" height="280" rx="12" fill="url(#grid)"/>
<path d="M736 24V256" stroke="#243556"/>
<text x="40" y="34" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#8BA3C7" font-weight="600" letter-spacing="1.6">PAYMENTS / LEDGER / RISK</text>
<text x="37" y="116" font-family="Arial,Helvetica,sans-serif" font-size="76" fill="#FFFFFF" font-weight="700">PayFlow</text>
<text x="40" y="165" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#E8EEF8" font-weight="500">Exactly-once charges. Correct ledger.</text>
<text x="40" y="204" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#A9BBD6" font-weight="400">Tokenize. Authorize once. Post balanced entries.</text>
<text x="40" y="251" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7F95B8" font-weight="500" letter-spacing="1.1">GO · POSTGRES · REACT · PCI-SCOPED VAULT</text>
<rect x="778" y="42" width="194" height="73" rx="7" fill="#121A2B" stroke="#3A5078"/>
<text x="792" y="61" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#8BA3C7" font-weight="500" letter-spacing="1">01</text>
<text x="792" y="85" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#FFFFFF" font-weight="600">Tokenize</text>
<text x="792" y="104" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#A9BBD6" font-weight="400">Vault-only PAN scope</text>
<rect x="1006" y="42" width="194" height="73" rx="7" fill="#121A2B" stroke="#3A5078"/>
<text x="1020" y="61" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#8BA3C7" font-weight="500" letter-spacing="1">02</text>
<text x="1020" y="85" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#FFFFFF" font-weight="600">Authorize</text>
<text x="1020" y="104" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#A9BBD6" font-weight="400">Idempotent claim</text>
<rect x="1006" y="154" width="194" height="73" rx="7" fill="#121A2B" stroke="#3A5078"/>
<text x="1020" y="173" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#8BA3C7" font-weight="500" letter-spacing="1">03</text>
<text x="1020" y="197" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#FFFFFF" font-weight="600">Ledger</text>
<text x="1020" y="216" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#A9BBD6" font-weight="400">DB-enforced balance</text>
<rect x="778" y="154" width="194" height="73" rx="7" fill="#121A2B" stroke="#3A5078"/>
<text x="792" y="173" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#8BA3C7" font-weight="500" letter-spacing="1">04</text>
<text x="792" y="197" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#FFFFFF" font-weight="600">Reconcile</text>
<text x="792" y="216" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#A9BBD6" font-weight="400">Ambiguous ` failed</text>
<text x="778" y="259" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#8BA3C7" font-weight="500" letter-spacing="0.8">ONE KEY · ONE BANK AUTH · ONE CHARGE</text>
</svg>
