<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayFlow Secure Card Input</title>
<!--
  The hosted card-input frame (§2.4).

  This page is served from the vault's own origin and embedded in the
  merchant's checkout page as an iframe. Because of the browser's same-origin
  policy, the merchant's JavaScript cannot read anything inside this document —
  including the card number the customer types. That single fact is the entire
  PCI-scope-reduction strategy: the card data goes from this frame straight to
  the vault, never touching the merchant's server or PayFlow's Payments API.

  The card number never leaves this document except as a POST to the vault.
  It is never put in a URL, never in postMessage, never in a parent-accessible
  variable.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: transparent;
    --field-bg: #ffffff;
    --border: #d4d8de;
    --border-focus: #5b6be8;
    --text: #1a1d23;
    --muted: #6b7280;
    --error: #c0392b;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --field-bg: #1c1f26;
      --border: #363b45;
      --border-focus: #7c88f0;
      --text: #e8eaed;
      --muted: #9aa1ab;
      --error: #f07167;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .row { display: flex; gap: 10px; }
  .field { position: relative; margin-bottom: 12px; flex: 1; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
    letter-spacing: .01em;
  }

  input {
    width: 100%;
    padding: 11px 12px;
    font: inherit;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
    color: var(--text);
    background: var(--field-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color .12s, box-shadow .12s;
  }
  input:focus {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--border-focus) 22%, transparent);
  }
  input.invalid { border-color: var(--error); }

  /* Room for the network badge inside the number field. */
  #number { padding-right: 62px; }

  .badge {
    position: absolute;
    right: 10px;
    top: 27px;
    height: 22px;
    padding: 0 7px;
    display: none;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #fff;
    border-radius: 4px;
  }
  .badge.show { display: inline-flex; }
  .badge[data-network="visa"]       { background: #1a1f71; }
  .badge[data-network="mastercard"] { background: #cc5500; }
  .badge[data-network="amex"]       { background: #006fcf; }
  .badge[data-network="discover"]   { background: #d97706; }
  .badge[data-network="rupay"]      { background: #097969; }

  .error {
    min-height: 15px;
    font-size: 12px;
    color: var(--error);
    margin-top: 4px;
  }
  .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
</style>
</head>
<body>

<form id="form" novalidate autocomplete="on">
  <div class="field">
    <label for="number">Card number</label>
    <input id="number" name="number" inputmode="numeric" autocomplete="cc-number"
           placeholder="1234 5678 9012 3456" aria-describedby="number-error">
    <span class="badge" id="badge" aria-live="polite"></span>
    <div class="error" id="number-error" role="alert"></div>
  </div>

  <div class="row">
    <div class="field">
      <label for="expiry">Expiry</label>
      <input id="expiry" name="expiry" inputmode="numeric" autocomplete="cc-exp"
             placeholder="MM / YY" maxlength="7" aria-describedby="expiry-error">
      <div class="error" id="expiry-error" role="alert"></div>
    </div>
    <div class="field">
      <label for="cvc">Security code</label>
      <input id="cvc" name="cvc" inputmode="numeric" autocomplete="cc-csc"
             placeholder="123" maxlength="4" aria-describedby="cvc-error">
      <div class="error" id="cvc-error" role="alert"></div>
    </div>
  </div>

  <div class="hint">
    <svg width="11" height="13" viewBox="0 0 11 13" fill="currentColor" aria-hidden="true">
      <path d="M5.5 0L0 2v4.2C0 9.4 2.3 12.3 5.5 13c3.2-.7 5.5-3.6 5.5-6.8V2L5.5 0z" opacity=".85"/>
    </svg>
    Card details go directly to PayFlow — this merchant never sees them.
  </div>
</form>

<script type="module" src="./checkout.js"></script>
</body>
</html>
