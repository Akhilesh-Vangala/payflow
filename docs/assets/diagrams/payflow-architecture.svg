<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">PayFlow architecture</title>
<desc id="desc">Checkout, vault, payments API, ledger, risk, and webhooks.</desc>
<rect width="1100" height="420" rx="12" fill="#F7FAFC"/>
<text x="40" y="42" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#0B1220" font-weight="700">PayFlow · charge path</text>
<text x="40" y="68" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4A5568">Merchant UI never sees a PAN. Payments API never stores one.</text>

<rect x="40" y="100" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="55" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0B1220" font-weight="600">Checkout / demo</text>
<text x="55" y="152" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">iframe card entry</text>

<rect x="260" y="100" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
<text x="275" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0B1220" font-weight="600">Vault</text>
<text x="275" y="152" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">tokenize · PCI scope</text>

<rect x="480" y="100" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#0B1220" stroke-width="2"/>
<text x="495" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0B1220" font-weight="600">Payments API</text>
<text x="495" y="152" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">idempotency · charges</text>

<rect x="720" y="100" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="735" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0B1220" font-weight="600">Bank sim</text>
<text x="735" y="152" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">authorize / capture</text>

<rect x="920" y="100" width="140" height="70" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="935" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0B1220" font-weight="600">Risk</text>
<text x="935" y="152" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">rules + model</text>

<path d="M220 135H260M440 135H480M680 135H720M880 135H920" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#64748B"/>
  </marker>
</defs>

<rect x="260" y="230" width="240" height="90" rx="8" fill="#0B1220"/>
<text x="280" y="265" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#FFFFFF" font-weight="600">Postgres ledger</text>
<text x="280" y="290" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A9BBD6">balanced entries · deferred triggers</text>
<text x="280" y="308" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A9BBD6">append-only · one tx with outbox</text>

<rect x="540" y="230" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="560" y="265" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#0B1220" font-weight="600">Webhook worker</text>
<text x="560" y="290" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">outbox · retry · DLQ</text>
<text x="560" y="308" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">signed merchant delivery</text>

<rect x="800" y="230" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="820" y="265" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#0B1220" font-weight="600">Scheduler</text>
<text x="820" y="290" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">reconcile · payouts</text>
<text x="820" y="308" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">ambiguous ’ ask bank</text>

<path d="M580 170V230M640 170V230M820 170V230" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>

<text x="40" y="380" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#334155">100 concurrent requests · 1 idempotency key ’ 1 bank authorization, 1 charge</text>
</svg>
